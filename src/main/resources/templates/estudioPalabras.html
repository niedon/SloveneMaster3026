<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">


<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudio - Esloveno</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <th:block th:replace="~{fragments/head-favicon :: head-favicon}"></th:block>
</head>

<body>

    <div th:replace="~{fragments/navbar :: navbar('📖 Estudio de Palabras')}"></div>
    <div class="container">

        <form action="/enviarRespuestas" method="POST" id="respuestasForm">
            <input type="hidden" id="tiempoTotalSegundos" name="tiempoTotalSegundos" value="">
            <table class="estudio-table">
                <tbody>
                    <!-- Fila 1: pregunta (transparente al idioma) -->
                    <tr class="row-visible">
                        <th:block th:each="dato : ${datos}">
                            <td class="text-center" th:classappend="${dato.id != null} ? 'celda-srs' : ''">
                                <strong th:text="${dato.textoFila1}"></strong>
                            </td>
                        </th:block>
                    </tr>

                    <!-- Fila 2: respuesta y botones (colapsada) -->
                    <tr class="row-collapsed" id="row-details">
                        <th:block th:each="dato, index : ${datos}">
                            <td class="text-center" th:classappend="${dato.id != null} ? 'celda-srs' : ''">
                                <strong th:text="${dato.textoFila2}"></strong>

                                <!-- Botones y próx estudio -->
                                <th:block th:if="${dato.id != null}">
                                    <br/>
                                    <div class="button-container">
                                        <button type="button" class="btn-abajo btn-danger" th:id="|btn_abajo_${index.index}|"
                                                th:onclick="|setResponse(${index.index})|">👎</button>
                                        <button type="button" class="btn-arriba btn-success" th:id="|btn_arriba_${index.index}|"
                                                th:onclick="|setResponse(${index.index})|">👍</button>
                                    </div>

                                    <div th:id="|intervalo_${index.index}|" class="intervalo-texto">
                                        <span th:id="|intervalo_texto_${index.index}|"></span>
                                    </div>
                                    <input type="hidden" th:id="|intervalo_arriba_${index.index}|" th:value="${dato.intervaloArriba}">
                                    <input type="hidden" th:id="|intervalo_abajo_${index.index}|" th:value="${dato.intervaloAbajo}">
                                    <input type="hidden" th:name="|tipo_${index.index}|" th:value="${dato.tipo.xmlCode}">
                                    <input type="hidden" th:name="|id_${index.index}|" th:value="${dato.id}">
                                    <input type="hidden" th:id="|valor_${index.index}|" th:name="|valor_${index.index}|" value="" class="valor-input">
                                </th:block>
                            </td>
                        </th:block>
                    </tr>
                </tbody>
            </table>

            <div class="text-center">
                <button type="button" class="btn-secondary" onclick="showDetails(); return false;">Mostrar respuestas</button>
                <button type="submit" class="btn-primary submit-btn">Enviar Respuestas</button>
            </div>
        </form>

        <!-- Contador de tarjetas disponibles -->
        <div class="tarjetas-info">
            <th:block th:switch="${keyMensaje}">
                <p th:case="'nohayfrases'" class="sin-tarjetas">✅ ¡No hay frases disponibles! Entra en <a href="/configuracion">Configuración</a> y activa alguna frase.</p>
                <p th:case="'sinfrases'" class="sin-tarjetas">✅ ¡No hay frases pendientes! Vuelve más tarde o añade más palabras.</p>
                <p th:case="'disponibles'" class="tarjetas-disponibles">📚 Hay <strong th:text="${tarjetasDisponibles}">0</strong> palabra(s) disponible(s) para el estudio</p>
                <p th:case="'nuevas'" class="tarjetas-nuevas">🆕 Hay <strong th:text="${tarjetasNuevas}">0</strong> palabra(s) nueva(s) para aprender</p>
                <p th:case="*" class="sin-tarjetas">✅ ¡No hay tarjetas pendientes! Vuelve más tarde.</p>
            </th:block>
        </div>

    </div>

    <script>
        function showDetails() {
            const detailsRow = document.getElementById('row-details');
            detailsRow.classList.remove('row-collapsed');
        }

        function setResponse(index, respuesta) {
            if (!respuesta) {
                const btnArriba = document.getElementById('btn_arriba_' + index);
                const btnAbajo = document.getElementById('btn_abajo_' + index);

                if (event.target.id === 'btn_arriba_' + index) {
                    respuesta = 'arriba';
                } else if (event.target.id === 'btn_abajo_' + index) {
                    respuesta = 'abajo';
                }
            }

            document.getElementById('valor_' + index).value = respuesta;

            const btnArriba = document.getElementById('btn_arriba_' + index);
            const btnAbajo = document.getElementById('btn_abajo_' + index);

            if (respuesta === 'arriba') {
                btnArriba.classList.add('selected');
                btnAbajo.classList.remove('selected');
            } else if (respuesta === 'abajo') {
                btnAbajo.classList.add('selected');
                btnArriba.classList.remove('selected');
            }

            // Mostrar el intervalo correspondiente
            const intervaloContainer = document.getElementById('intervalo_' + index);
            const intervaloTexto = document.getElementById('intervalo_texto_' + index);
            const intervaloArriba = document.getElementById('intervalo_arriba_' + index);
            const intervaloAbajo = document.getElementById('intervalo_abajo_' + index);

            if (intervaloContainer && intervaloTexto && intervaloArriba && intervaloAbajo) {
                if (respuesta === 'arriba' && intervaloArriba.value) {
                    intervaloTexto.textContent = '⏰ Próx: ' + intervaloArriba.value;
                    intervaloContainer.classList.add('intervalo-visible');
                } else if (respuesta === 'abajo' && intervaloAbajo.value) {
                    intervaloTexto.textContent = '⏰ Próx: ' + intervaloAbajo.value;
                    intervaloContainer.classList.add('intervalo-visible');
                } else {
                    intervaloContainer.classList.remove('intervalo-visible');
                }
            }

            const detailsRow = document.getElementById('row-details');
            if (detailsRow.classList.contains('collapsed')) {
                showDetails();
            }
        }

        let tiempoInicioEstudio = null;
        document.addEventListener("DOMContentLoaded", () => {
            tiempoInicioEstudio = Date.now();
        });

        document.getElementById('respuestasForm').addEventListener('submit', function(event) {
            const valorInputs = document.querySelectorAll('.valor-input');
            let allCompleted = true;

            valorInputs.forEach(input => {
                if (input.value === '') {
                    allCompleted = false;
                }
            });

            if (!allCompleted) {
                event.preventDefault();
                alert('Quedan palabras por puntuar');
                return false;
            }

            if (tiempoInicioEstudio) {
                const tiempoFinEstudio = Date.now();
                const segundos = Math.floor((tiempoFinEstudio - tiempoInicioEstudio) / 1000);
                document.getElementById('tiempoTotalSegundos').value = segundos;
            }
        });
    </script>


</body>

</html>
