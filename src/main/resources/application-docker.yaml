spring:
  application:
    name: com.bcadaval.esloveno
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlite:/app-data/db/esloveno.db}
    driver-class-name: org.sqlite.JDBC
    username: sa
    password: sa
    hikari:
      maximum-pool-size: 1
      connection-test-query: SELECT 1
  sql:
    init:
      mode: always
      schema-locations: classpath:initDatabase.sql
      continue-on-error: true
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    defer-datasource-initialization: true
  mvc:
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp

server:
  servlet:
    context-path: /

app:
  db:
    path: /app-data/db/esloveno.db
  xml:
    path: /app-data/xml

hibernate:
  dialect: org.hibernate.community.dialect.SQLiteDialect
  hbm2ddl:
    auto: none

logging:
  level:
    root: INFO
    com.bcadaval.esloveno: DEBUG
    org:
      springframework:
        web: INFO  # Desactivar logs DEBUG de requests HTTP
